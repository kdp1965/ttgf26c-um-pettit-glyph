name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Read top module name
        id: top_module
        run: echo "TOP_MODULE=$(yq '.project.top_module' info.yaml)" >> "$GITHUB_OUTPUT"

      # Publish the locally hardened views in local_build/ instead of running
      # LibreLane on the runner: at this density the route converges with the
      # local flow and not with the runner's (make promote RUN=runs/<TAG>
      # refreshes local_build/ from a run).  The netlist is the powered one,
      # which is what the gate level job simulates on GF180.
      - name: Create and publish the GDS artifact
        uses: TinyTapeout/tt-gds-action/custom_gds@ttgf26c
        with:
          pdk: gf180mcuD
          top_module: ${{ steps.top_module.outputs.TOP_MODULE }}
          gds_path: local_build/gds/${{ steps.top_module.outputs.TOP_MODULE }}.gds
          lef_path: local_build/lef/${{ steps.top_module.outputs.TOP_MODULE }}.lef
          verilog_path: local_build/pnl/${{ steps.top_module.outputs.TOP_MODULE }}.pnl.v

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttgf26c

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # The steps of TinyTapeout/tt-gds-action/gl_test@ttgf26c written out.
      # That action reads the PDK version from tt_submission/pdk.json, which
      # the custom_gds action does not write, so the version is given here:
      # the one the standard gds action hardens with, and the one
      # local_build/ was hardened with.
      - name: Download GDS artifact
        uses: actions/download-artifact@v7
        with:
          name: tt_submission

      - name: Install the gf180mcuD PDK
        uses: TinyTapeout/ciel-action@v1
        with:
          pdk_name: gf180mcuD
          pdk_version: 54435919abffb937387ec956209f9cf5fd2dfbee
          pdk_root: /home/runner/pdk

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install -r test/requirements.txt

      - name: Install iverilog
        run: |
          wget https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb
          sudo apt-get update -y
          sudo apt-get install -y ./iverilog_13.0-1_amd64.deb

      - name: Run tests
        env:
          PDK: gf180mcuD
          PDK_ROOT: /home/runner/pdk
        run: |
          cp tt_submission/*.v test/gate_level_netlist.v
          cd test
          rm -f tb.vcd tb.fst results.xml
          make clean
          GATES=yes make
          # make succeeds even if tests fail, so check results.xml
          python -m cocotb_tools.check_results results.xml

      - name: Upload Waveform and Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gatelevel_test_results
          path: |
            test/tb.vcd
            test/tb.fst
            test/results.xml
            test/output/*

      - name: Test Summary
        if: always()
        uses: test-summary/action@v2.6
        with:
          paths: test/results.xml

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttgf26c
