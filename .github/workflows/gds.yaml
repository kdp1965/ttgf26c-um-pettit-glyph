name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Read top module name
        id: top_module
        run: echo "TOP_MODULE=$(yq '.project.top_module' info.yaml)" >> "$GITHUB_OUTPUT"

      # Publish the locally hardened views in local_build/ instead of running
      # LibreLane on the runner: at this density the route converges with the
      # local flow and not with the runner's (make promote RUN=runs/<TAG>
      # refreshes local_build/ from a run).  The netlist is the powered one,
      # which is what the gate level job simulates on GF180.
      - name: Create and publish the GDS artifact
        uses: TinyTapeout/tt-gds-action/custom_gds@ttgf26c
        with:
          pdk: gf180mcuD
          top_module: ${{ steps.top_module.outputs.TOP_MODULE }}
          gds_path: local_build/gds/${{ steps.top_module.outputs.TOP_MODULE }}.gds
          lef_path: local_build/lef/${{ steps.top_module.outputs.TOP_MODULE }}.lef
          verilog_path: local_build/pnl/${{ steps.top_module.outputs.TOP_MODULE }}.pnl.v

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttgf26c

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # The steps of TinyTapeout/tt-gds-action/gl_test@ttgf26c written out.
      # That action reads the PDK version from tt_submission/pdk.json, which
      # the custom_gds action does not write, so the version is given here:
      # the one the standard gds action hardens with, and the one
      # local_build/ was hardened with.
      - name: Download GDS artifact
        uses: actions/download-artifact@v7
        with:
          name: tt_submission

      - name: Install the gf180mcuD PDK
        uses: TinyTapeout/ciel-action@v1
        with:
          pdk_name: gf180mcuD
          pdk_version: 54435919abffb937387ec956209f9cf5fd2dfbee
          pdk_root: /home/runner/pdk

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install -r test/requirements.txt

      - name: Install iverilog
        run: |
          wget https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb
          sudo apt-get update -y
          sudo apt-get install -y ./iverilog_13.0-1_amd64.deb

      - name: Run tests
        env:
          PDK: gf180mcuD
          PDK_ROOT: /home/runner/pdk
        run: |
          cp tt_submission/*.v test/gate_level_netlist.v
          cd test
          rm -f tb.vcd tb.fst results.xml
          make clean
          GATES=yes make
          # make succeeds even if tests fail, so check results.xml
          python -m cocotb_tools.check_results results.xml

      - name: Upload Waveform and Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gatelevel_test_results
          path: |
            test/tb.vcd
            test/tb.fst
            test/results.xml
            test/output/*

      - name: Test Summary
        if: always()
        uses: test-summary/action@v2.6
        with:
          paths: test/results.xml

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      # The steps of TinyTapeout/tt-gds-action/viewer@ttgf26c written out,
      # with a wait and one retry around the Pages deployment: it often fails
      # with "Fetching artifact metadata failed" when it runs straight after
      # the upload, before the new artifact is listed.
      - name: Download GDS artifact
        uses: actions/download-artifact@v7
        with:
          name: tt_submission

      - name: Download gds_render (png) artifact
        uses: actions/download-artifact@v7
        with:
          name: gds_render
          path: gh-pages

      - name: Assemble the site
        run: |
          PDK=$(jq -r '.PDK' tt_submission/pdk.json)
          echo "PDK=$PDK" >> $GITHUB_ENV
          cp tt_submission/*.gds gh-pages/tinytapeout.gds
          cp tt_submission/*.oas gh-pages/tinytapeout.oas
          cat << EOF > gh-pages/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Redirecting to 3D Viewer...</title>
          </head>
          <body>
            <script>
              location.href = "https://gds-viewer.tinytapeout.com/?pdk=$PDK&model=" + encodeURIComponent(location.href + '/tinytapeout.oas');
            </script>
          </body>
          </html>
          EOF

      # A name per attempt: a re-run keeps the earlier attempts' artifacts.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'gh-pages'
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for the artifact to be listed
        run: sleep 30

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait before the retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Display preview in workflow summary
        run: |
          PAGE_URL="${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}"
          PAGE_URL=$(echo "$PAGE_URL" | sed -e 's/\/$//')
          cat << EOF >> $GITHUB_STEP_SUMMARY
          # 3D Viewer
          [Open 3D viewer](https://gds-viewer.tinytapeout.com/?model=$PAGE_URL/tinytapeout.oas&pdk=$PDK)

          # Tiny Tapeout Explorer
          [Open in Tiny Tapeout Explorer](https://gds-explorer.tinytapeout.com/viewer?file=$PAGE_URL/tinytapeout.oas&pdk=$PDK)

          # 2D Preview
          ![png]($PAGE_URL/gds_render.png)
          EOF
